<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

	<h2>Login Here</h2>

	<div th:if="${errorMsg}">
		<h3 style="color: red;" th:text="${errorMsg}"></h3>
	</div>

	<form th:action="@{/loginForm}" th:object="${user}" method="post">
		Email Id : <input type="text" th:field="*{email}" /> <br> <br>
		Password : <input type="text" th:field="*{password}" /> <br> <br>
		<input type="submit" value="Login">

	</form>

	<br />
	<br />

	<a href="index.html">Home</a>
	<br />
	<br />
	<a href="regPage">Register</a>

</body>
</html>
